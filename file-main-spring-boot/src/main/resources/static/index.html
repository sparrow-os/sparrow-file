<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sparrow File · 文件服务</title>
    <style>
        :root {
            --bg: #07070d;
            --bg-soft: #0c0c16;
            --panel: rgba(255, 255, 255, 0.04);
            --panel-strong: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);
            --text: #f4f4f7;
            --text-dim: #9a9ab0;
            --text-faint: #64647c;
            --accent-1: #6d5cff;
            --accent-2: #22d3ee;
            --accent-3: #a855f7;
            --danger: #f43f5e;
            --ok: #34d399;
            --radius: 20px;
            --shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ---- ambient background ---- */
        .ambient {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(109, 92, 255, 0.16), transparent 60%),
                radial-gradient(1000px 500px at 90% 0%, rgba(34, 211, 238, 0.12), transparent 55%),
                radial-gradient(900px 700px at 50% 120%, rgba(168, 85, 247, 0.12), transparent 60%);
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 75%);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            z-index: -1;
            animation: float 14s var(--ease) infinite alternate;
        }
        .orb-1 { width: 420px; height: 420px; top: -120px; left: -80px;
            background: radial-gradient(circle, #6d5cff, transparent 70%); }
        .orb-2 { width: 360px; height: 360px; top: 20%; right: -100px;
            background: radial-gradient(circle, #22d3ee, transparent 70%);
            animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; bottom: -100px; left: 40%;
            background: radial-gradient(circle, #a855f7, transparent 70%);
            animation-delay: -9s; }

        @keyframes float {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(40px, 30px, 0) scale(1.15); }
        }

        /* ---- layout ---- */
        .wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 72px 24px 96px;
        }

        header {
            text-align: center;
            margin-bottom: 56px;
            animation: rise 0.9s var(--ease) both;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            border-radius: 100px;
            background: var(--panel);
            border: 1px solid var(--border);
            font-size: 13px;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 28px;
            backdrop-filter: blur(10px);
        }
        .brand .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 0 12px rgba(109, 92, 255, 0.8);
        }

        h1 {
            font-size: clamp(40px, 7vw, 72px);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: 22px;
        }
        h1 .gradient {
            background: linear-gradient(120deg, #c4b5fd 0%, #7dd3fc 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            max-width: 560px;
            margin: 0 auto;
            color: var(--text-dim);
            font-size: 17px;
            font-weight: 400;
        }

        /* ---- features row ---- */
        .features {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .feature {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: var(--text-dim);
            padding: 7px 14px;
            border-radius: 100px;
            background: var(--panel);
            border: 1px solid var(--border);
        }
        .feature svg { width: 14px; height: 14px; opacity: 0.85; }

        /* ---- upload card ---- */
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: rise 0.9s var(--ease) 0.1s both;
        }

        .card-head {
            padding: 22px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .card-head .title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .card-head .hint {
            font-size: 12.5px;
            color: var(--text-faint);
        }

        /* path-type segmented */
        .segments {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .seg {
            appearance: none;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 12.5px;
            font-family: inherit;
            padding: 7px 13px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.25s var(--ease);
            white-space: nowrap;
        }
        .seg:hover { color: var(--text); border-color: var(--border-strong); }
        .seg.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(109, 92, 255, 0.9), rgba(168, 85, 247, 0.9));
            border-color: transparent;
            box-shadow: 0 6px 20px -6px rgba(109, 92, 255, 0.7);
        }

        /* dropzone */
        .dropzone {
            position: relative;
            margin: 28px;
            padding: 64px 32px;
            border: 1.5px dashed var(--border-strong);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s var(--ease);
            background: radial-gradient(400px 200px at 50% 0%, rgba(109, 92, 255, 0.08), transparent 70%);
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent-1);
            background: radial-gradient(500px 260px at 50% 0%, rgba(109, 92, 255, 0.16), transparent 70%);
            transform: translateY(-2px);
        }
        .dropzone.dragover { box-shadow: 0 0 0 5px rgba(109, 92, 255, 0.12); }

        .dz-icon {
            width: 60px; height: 60px;
            margin: 0 auto 22px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, rgba(109, 92, 255, 0.18), rgba(34, 211, 238, 0.14));
            border: 1px solid var(--border-strong);
        }
        .dz-icon svg { width: 28px; height: 28px; color: #c4b5fd; }

        .dropzone .dz-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
        .dropzone .dz-sub { font-size: 13.5px; color: var(--text-faint); }
        .dropzone .dz-sub b { color: var(--text-dim); font-weight: 600; }
        .dropzone input[type="file"] { display: none; }

        /* ---- file list ---- */
        .files { padding: 6px 28px 28px; }
        .files:empty { display: none; }

        .file-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px;
            border-radius: 14px;
            background: var(--panel);
            border: 1px solid var(--border);
            margin-bottom: 10px;
            animation: slide 0.4s var(--ease) both;
        }
        .thumb {
            width: 52px; height: 52px;
            border-radius: 12px;
            flex-shrink: 0;
            object-fit: cover;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .thumb .file-ico { color: var(--text-faint); }

        .file-meta { flex: 1; min-width: 0; }
        .file-name {
            font-size: 14px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .file-size { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

        .file-status { font-size: 12.5px; font-weight: 600; flex-shrink: 0; }
        .file-status.uploading { color: var(--accent-2); }
        .file-status.done { color: var(--ok); }
        .file-status.error { color: var(--danger); }

        .bar {
            height: 4px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            margin-top: 8px;
        }
        .bar > span {
            display: block; height: 100%; width: 0;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            border-radius: 100px;
            transition: width 0.2s linear;
        }

        .url-row { margin-top: 10px; display: none; }
        .file-item.done .url-row { display: flex; }
        .url-row {
            align-items: center; gap: 8px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
        }
        .url-row .url {
            flex: 1; min-width: 0;
            font-size: 12.5px; color: var(--text-dim);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
        .copy-btn, .open-btn {
            flex-shrink: 0;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 12px; font-family: inherit;
            padding: 5px 12px; border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        .copy-btn:hover, .open-btn:hover { color: #fff; border-color: var(--border-strong); }
        .copy-btn.copied { color: var(--ok); border-color: rgba(52, 211, 153, 0.4); }

        /* ---- footer ---- */
        /* ---- demo links ---- */
        .demo-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
            animation: rise 0.9s var(--ease) 0.15s both;
        }
        .demo-links .label {
            color: var(--text-faint);
            font-size: 13px;
            margin-right: 4px;
        }
        .demo-links a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: var(--panel);
            transition: all 0.25s var(--ease);
        }
        .demo-links a:hover {
            color: #fff;
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }
        .demo-links a svg { width: 13px; height: 13px; opacity: 0.8; }

        footer {
            text-align: center;
            margin-top: 48px;
            color: var(--text-faint);
            font-size: 12.5px;
            animation: rise 0.9s var(--ease) 0.2s both;
        }
        footer .sep { margin: 0 8px; opacity: 0.5; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes slide {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .toast {
            position: fixed;
            bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-soft);
            border: 1px solid var(--border-strong);
            color: var(--text);
            padding: 12px 22px;
            border-radius: 100px;
            font-size: 13.5px;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s var(--ease);
            z-index: 50;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 560px) {
            .wrap { padding: 48px 16px 64px; }
            .dropzone { margin: 16px; padding: 44px 20px; }
            .files { padding: 4px 16px 20px; }
            .file-item { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<div class="ambient"></div>
<div class="grid-overlay"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="wrap">
    <header>
        <div class="brand">
            <span class="dot"></span>
            SPARROW FILE · 分布式文件服务
        </div>
        <h1>上传你的<span class="gradient">每一个文件</span></h1>
        <p class="subtitle">
            极简、快速、安全。基于 Sparrow 生态的统一文件上传与存储服务，
            支持拖拽上传、实时进度与即时预览。
        </p>
        <div class="features">
            <span class="feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                安全存储
            </span>
            <span class="feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                极速上传
            </span>
            <span class="feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
                即时预览
            </span>
            <span class="feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                多端适配
            </span>
        </div>
    </header>

    <div class="card">
        <div class="card-head">
            <div>
                <div class="title">上传文件</div>
                <div class="hint">选择存储路径，拖拽或点击上传</div>
            </div>
            <div class="segments" id="segments">
                <button class="seg active" data-key="resource">资源</button>
                <button class="seg" data-key="resource_cover">封面</button>
                <button class="seg" data-key="cms">CMS</button>
                <button class="seg" data-key="comment">评论</button>
                <button class="seg" data-key="thread">帖子</button>
                <button class="seg" data-key="user">头像</button>
                <button class="seg" data-key="app">应用</button>
            </div>
        </div>

        <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" multiple/>
            <div class="dz-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <div class="dz-title">拖拽文件到此处，或 <b>点击选择</b></div>
            <div class="dz-sub">支持单个 / 多个文件上传，单文件上限 <b>2MB</b></div>
        </div>

        <div class="files" id="files"></div>
    </div>

    <div class="demo-links">
        <span class="label">示例页面</span>
        <a href="/upload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            原生上传
        </a>
        <a href="/spring-upload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Spring 上传
        </a>
    </div>

    <footer>
        Sparrow File<span class="sep">·</span>Powered by Sparrow OS
        <span class="sep">·</span>resource: r.sparrowzoo.net
    </footer>
</div>

<div class="toast" id="toast"></div>

<script>
    (function () {
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const filesEl = document.getElementById('files');
        const segments = document.getElementById('segments');
        const toastEl = document.getElementById('toast');

        let pathKey = 'resource';
        let toastTimer = null;

        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
        }

        function humanSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }

        segments.addEventListener('click', (e) => {
            const seg = e.target.closest('.seg');
            if (!seg) return;
            segments.querySelectorAll('.seg').forEach(s => s.classList.remove('active'));
            seg.classList.add('active');
            pathKey = seg.dataset.key;
        });

        function isImage(file) {
            return file.type && file.type.startsWith('image/');
        }

        function buildItem(file) {
            const item = document.createElement('div');
            item.className = 'file-item';

            const thumb = document.createElement('div');
            thumb.className = 'thumb';
            if (isImage(file)) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                thumb.appendChild(img);
            } else {
                thumb.innerHTML = '<svg class="file-ico" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
            }

            const meta = document.createElement('div');
            meta.className = 'file-meta';
            meta.innerHTML =
                '<div class="file-name"></div>' +
                '<div class="file-size"></div>' +
                '<div class="bar"><span></span></div>' +
                '<div class="url-row">' +
                '  <span class="url"></span>' +
                '  <button class="copy-btn">复制</button>' +
                '  <button class="open-btn">打开</button>' +
                '</div>';
            meta.querySelector('.file-name').textContent = file.name;
            meta.querySelector('.file-size').textContent = humanSize(file.size);

            const status = document.createElement('div');
            status.className = 'file-status uploading';
            status.textContent = '等待中';

            item.appendChild(thumb);
            item.appendChild(meta);
            item.appendChild(status);
            filesEl.appendChild(item);
            return { item, status, meta };
        }

        function upload(file, ui) {
            ui.status.className = 'file-status uploading';
            ui.status.textContent = '上传中';

            const form = new FormData();
            form.append('file', file);
            form.append('pathType', pathKey);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'upload.json', true);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    ui.meta.querySelector('.bar > span').style.width = pct + '%';
                    ui.status.textContent = pct + '%';
                }
            };

            xhr.onload = () => {
                const url = xhr.responseText.trim();
                if (xhr.status >= 200 && xhr.status < 300 && url && !url.startsWith('{')) {
                    ui.item.classList.add('done');
                    ui.status.className = 'file-status done';
                    ui.status.textContent = '完成';
                    ui.meta.querySelector('.bar > span').style.width = '100%';
                    const urlEl = ui.meta.querySelector('.url');
                    urlEl.textContent = url;
                    urlEl.title = url;
                } else {
                    ui.status.className = 'file-status error';
                    ui.status.textContent = '失败';
                    ui.meta.querySelector('.bar > span').style.background = 'var(--danger)';
                }
            };

            xhr.onerror = () => {
                ui.status.className = 'file-status error';
                ui.status.textContent = '网络错误';
            };

            xhr.send(form);
        }

        function handleFiles(fileList) {
            Array.from(fileList).forEach((file) => {
                const ui = buildItem(file);
                upload(file, ui);
            });
        }

        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
            fileInput.value = '';
        });

        ['dragenter', 'dragover'].forEach(ev =>
            dropzone.addEventListener(ev, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            })
        );
        ['dragleave', 'drop'].forEach(ev =>
            dropzone.addEventListener(ev, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            })
        );
        dropzone.addEventListener('drop', (e) => {
            handleFiles(e.dataTransfer.files);
        });

        // copy / open actions
        filesEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const urlRow = btn.closest('.url-row');
            const url = urlRow.querySelector('.url').textContent;
            if (!url) return;

            if (btn.classList.contains('copy-btn')) {
                navigator.clipboard.writeText(url).then(() => {
                    btn.textContent = '已复制';
                    btn.classList.add('copied');
                    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
                }).catch(() => toast('复制失败'));
            } else if (btn.classList.contains('open-btn')) {
                window.open(url, '_blank');
            }
        });

        // paste-to-upload
        window.addEventListener('paste', (e) => {
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            const files = [];
            for (const it of items) {
                if (it.kind === 'file') files.push(it.getAsFile());
            }
            if (files.length) handleFiles(files);
        });
    })();
</script>
</body>
</html>

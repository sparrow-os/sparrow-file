<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="pragma" content="no-cache"/>
    <meta http-equiv="cache-control" content="no-cache"/>
    <meta http-equiv="expires" content="0"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>原生上传示例 · Sparrow File</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0b0b14;
            color: #f4f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 48px 16px;
        }
        .page { width: 100%; max-width: 600px; }
        header { text-align: center; margin-bottom: 32px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #8a8aa0; font-size: 14px; }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title { font-size: 14px; font-weight: 600; color: #b9b9cc; margin-bottom: 14px; }
        /* 上传 iframe：内容由 file-upload 服务生成 */
        .file-frame {
            display: block;
            width: 100%;
            height: 40px;
            border: 1px dashed rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
        }
        /* 预览区 */
        .preview {
            min-height: 160px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            text-align: center;
            overflow: hidden;
        }
        .preview .empty { color: #5c5c70; font-size: 14px; }
        .preview .error { color: #f43f5e; font-size: 14px; }
        .preview img { max-width: 100%; max-height: 300px; border-radius: 8px; }
        .preview .url {
            font-size: 12px; color: #8a8aa0;
            word-break: break-all;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            padding: 7px 16px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6d5cff, #a855f7);
        }
        .back {
            display: inline-block;
            margin-top: 8px;
            color: #8a8aa0;
            font-size: 13px;
            text-decoration: none;
        }
        .back:hover { color: #fff; }
    </style>
    <script>
        // 上传回调对象（必须全局）。
        // file-upload 服务生成的页面会调用 parent.$ 里的这两个方法。
        $ = {
            file: {
                // 上传完成后回调。uploadingProgress 里包含 fileUrl（文件地址）和 error（错误信息）
                uploadCallBack: function (uploadingProgress) {
                    var preview = document.getElementById("divPreview");
                    if (uploadingProgress && uploadingProgress.error) {
                        preview.innerHTML = '<span class="error">上传失败：' + uploadingProgress.error + '</span>';
                        return;
                    }
                    if (!uploadingProgress || !uploadingProgress.fileUrl) {
                        return;
                    }
                    var url = uploadingProgress.fileUrl;
                    preview.innerHTML =
                        '<img src="' + url + '" alt="预览图"/>' +
                        '<div class="url">' + url + '</div>' +
                        '<a class="btn" href="' + url + '" target="_blank">打开原图</a>';
                },
                // 选择文件后调用：提交 iframe 里的表单，开始上传
                validateUploadFile: function (f, key, editor) {
                    var frameId = (editor ? editor.obj : "null") + "." + key;
                    var frame = document.getElementById(frameId);
                    frame.contentWindow.document.forms[0].submit();
                }
            }
        };
    </script>
</head>
<body>
<div class="page">
    <header>
        <h1>原生上传示例</h1>
        <p class="subtitle">通过 iframe 调用 file-upload 服务，选择文件后自动上传并预览</p>
    </header>

    <!-- 第一步：选择文件（iframe 里的表单由 file-upload 服务生成） -->
    <div class="card">
        <div class="card-title">① 选择文件</div>
        <iframe id="null.resource" class="file-frame" src="./file-upload?path-key=resource"></iframe>
    </div>

    <!-- 第二步：预览结果 -->
    <div class="card">
        <div class="card-title">② 上传预览</div>
        <div class="preview" id="divPreview">
            <span class="empty">上传成功后，图片会显示在这里</span>
        </div>
    </div>

    <p style="text-align:center;"><a class="back" href="/index.html">← 返回首页</a></p>
</div>
</body>
</html>
